## Project-wide Gradle settings.
# Creditos: Leandro - Soberano & Hacker Bot

# 1. PERFORMANCE DO SISTEMA DE COMPILAÇÃO
# Aumentamos a memória (Xmx4096m) para que o compilador C++ (NDK)
# consiga processar o motor do terminal sem travar o seu PC.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Executa tarefas em paralelo para que a build do APK seja mais rápida.
org.gradle.parallel=true
org.gradle.caching=true

# 2. COMPATIBILIDADE ANDROID (ESSENCIAL PARA FIREBASE E BOTS)
# Garante que o app use as bibliotecas modernas do Google.
android.useAndroidX=true
# O Jetifier converte bibliotecas antigas do Termux para o padrão novo automaticamente.
android.enableJetifier=true
# Melhora a organização dos IDs de recursos no código Java.
android.nonTransitiveRClass=true

# 3. VERSÕES GLOBAIS DO PROJETO
# Centralizar as versões aqui evita erros de "Sync Failed" no Android Studio.
minSdkVersion=24
targetSdkVersion=33
compileSdkVersion=34

# Versão do NDK (O motor C++ que vimos na sua pasta /cpp).
# Certifique-se de ter essa versão baixada no seu SDK Manager.
ndkVersion=26.1.10909125 

# 4. VERSÕES DE BIBLIOTECAS ESPECÍFICAS
# Versão da Markwon para os logs estilo Matrix (Verde Neon) no terminal.
markwonVersion=4.6.2
